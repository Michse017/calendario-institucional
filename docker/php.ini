; Los errores van al registro, nunca a la pantalla del visitante: un mensaje de
; error detallado revela rutas, consultas y versiones.
display_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

expose_php = Off
max_execution_time = 30
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M

date.timezone = UTC

; La cookie de sesión la configura la aplicación en App\Core\Sesion.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
