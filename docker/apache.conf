# El documento raíz es public/: todo lo demás (app/, sql/, bin/, .env) queda
# fuera del alcance del servidor web aunque alguien adivine la ruta.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
