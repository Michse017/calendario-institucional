# El puerto lo inyecta la plataforma en tiempo de arranque (ver entrypoint.sh).
Listen ${PUERTO}

# El documento raíz es public/: todo lo demás (app/, sql/, bin/, .env) queda
# fuera del alcance del servidor web aunque alguien adivine la ruta.
<VirtualHost *:${PUERTO}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Los registros van a la salida estándar del contenedor, que es donde los
    # recoge la plataforma.
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
