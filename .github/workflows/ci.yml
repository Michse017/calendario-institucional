name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Sintaxis y pruebas
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: raiz
          MARIADB_DATABASE: calendario_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Comprobar la sintaxis de todo el PHP
        run: |
          find app bin public tests bootstrap.php -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Aplicar el esquema
        run: mysql -h 127.0.0.1 -u root -praiz < sql/001_schema.sql

      - name: Ejecutar la batería de pruebas
        run: php tests/run.php
        env:
          APP_ENV: testing
          APP_DEBUG: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: calendario_demo
          DB_USER: root
          DB_PASS: raiz

      - name: Sembrar los datos de ejemplo
        run: php bin/sembrar_demo.php --con-usuarios
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: calendario_demo
          DB_USER: root
          DB_PASS: raiz

  estilos:
    name: El CSS compilado está al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Recompilar y comprobar que no falta ninguna clase propia
        # Vigila el caso real: que alguien escriba una regla directamente en el CSS
        # compilado y la pierda en la siguiente compilacion. No compara byte a byte
        # porque la salida de Tailwind depende del sistema de archivos.
        run: |
          cp public/assets/css/app.css /tmp/compilado-versionado.css
          npm run build
          node bin/verificar_css.mjs /tmp/compilado-versionado.css public/assets/css/app.css

  imagen:
    name: La imagen de Docker se construye
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t calendario-institucional:ci .
